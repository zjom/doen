[package]
name = "doen"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/zjom/doen"
license = "MIT"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "string"] }
deunicode = "1.6.2"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
yaml-rust2 = "0.13.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
