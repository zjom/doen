[package]
name = "doen"
version = "0.1.2"
edition = "2024"
description = "cli to get shit doen"
repository = "https://github.com/zjom/doen"
license = "MIT"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "string"] }
deunicode = "1.6.2"
rand = "0.10.3"
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
yaml-rust2 = "0.13.0"

[dev-dependencies]
assert_cmd = "2.2.2"
serde_json = "1.0.154"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["termios"] }
